name: Mi primera GitHub Action

on:
  push:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Mostrar mensaje
        run: echo "GitHub Actions funciona correctamente"

      - name: Mostrar archivos
        run: ls -la

      - name: Mostrar fecha
        run: date
